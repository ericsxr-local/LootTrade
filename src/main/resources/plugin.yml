name: LootTrade
version: 1.3.0
main: com.redmoore.loottrade.LootTradePlugin
api-version: '1.20'
author: Eric_SXR
description: 中文搜打撤战利品出售与命令方块木桶商品购买插件。
depend:
- Vault
commands:
  lt:
    description: LootTrade 主命令
    usage: /lt buy <价格>（仅命令方块） | /lt sellall | /lt sell <玩家|@p> all
    aliases:
    - loottrade
permissions:
  loottrade.sellall:
    description: 允许出售自己背包中的全部合格战利品
    default: true
  loottrade.admin:
    description: 允许代替其他玩家出售其背包中的合格战利品
    default: op
